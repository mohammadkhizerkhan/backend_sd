services:
  # ============================================================================
  # REDIS HIGH-AVAILABILITY TOPOLOGY (MASTER + 2 REPLICAS)
  # ============================================================================
  redis-master:
    image: redis:7.2-alpine
    container_name: redis-master
    command: >
      redis-server
      --port 6379
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    networks:
      - cache-net

  redis-replica-1:
    image: redis:7.2-alpine
    container_name: redis-replica-1
    command: >
      redis-server
      --port 6379
      --replicaof redis-master 6379
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6380:6379"
    depends_on:
      - redis-master
    volumes:
      - redis_replica1_data:/data
    networks:
      - cache-net

  redis-replica-2:
    image: redis:7.2-alpine
    container_name: redis-replica-2
    command: >
      redis-server
      --port 6379
      --replicaof redis-master 6379
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6381:6379"
    depends_on:
      - redis-master
    volumes:
      - redis_replica2_data:/data
    networks:
      - cache-net

  # ============================================================================
  # REDIS SENTINEL QUORUM (3 NODES FOR AUTOMATED FAILOVER)
  # ============================================================================
  redis-sentinel-1:
    image: redis:7.2-alpine
    container_name: redis-sentinel-1
    entrypoint: ["sh","/wait-for-redis.sh"]
    volumes:
      - ./wait-for-redis.sh:/wait-for-redis.sh
    ports:
      - "26379:26379"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - cache-net

  redis-sentinel-2:
    image: redis:7.2-alpine
    container_name: redis-sentinel-2
    entrypoint: ["sh","/wait-for-redis.sh"]
    volumes:
      - ./wait-for-redis.sh:/wait-for-redis.sh
    ports:
      - "26380:26379"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - cache-net

  redis-sentinel-3:
    image: redis:7.2-alpine
    container_name: redis-sentinel-3
    entrypoint: ["sh","/wait-for-redis.sh"]
    volumes:
      - ./wait-for-redis.sh:/wait-for-redis.sh
    ports:
      - "26381:26379"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - cache-net

  # ============================================================================
  # MEMCACHED (MULTI-THREADED SLAB ALLOCATION ENGINE)
  # ============================================================================
  memcached:
    image: memcached:1.6-alpine
    container_name: memcached
    command:
      - -m
      - "128" # 128 MB max memory
      - -c
      - "1024" # 1024 max connections
      - -t
      - "4" # 4 worker threads
      - -v # verbose logging
    ports:
      - "11211:11211"
    networks:
      - cache-net

  # ============================================================================
  # OBSERVABILITY & MANAGEMENT UI
  # ============================================================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - cache-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://redis-master:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis-master
    networks:
      - cache-net

volumes:
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data:
  redisinsight_data:

networks:
  cache-net:
    driver: bridge
